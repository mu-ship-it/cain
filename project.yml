name: Cain
configFiles:
  Debug: Config/Cain.xcconfig
  Release: Config/Cain.xcconfig
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Simulator builds are ad-hoc signed ("sign to run locally"); no team needed.
    # A device build needs a paid team for com.apple.developer.networking.networkextension (docs/VPN.md).
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  Cain:
    type: application
    platform: iOS
    sources: [Cain, Shared]
    dependencies:
      - target: CainExt
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: Cain
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the build-number script reads .git
        PRODUCT_BUNDLE_IDENTIFIER: $(CAIN_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 该隐
    info:
      path: Cain/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 该隐
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Shared with the tunnel extension: profiles, selected profile, tunnel log.
        CainAppGroup: group.$(CAIN_BUNDLE_ID)
        CainTunnelBundleID: $(CAIN_BUNDLE_ID).ext
    postBuildScripts:
      - name: Build number = git commit count
        basedOnDependencyAnalysis: false
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]   # run after Info.plist is processed
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "$CURRENT_PROJECT_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: Cain/Cain.entitlements
      properties:
        # Needs a paid Apple Developer team (see docs/VPN.md); the simulator build carries it unsigned.
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.$(CAIN_BUNDLE_ID)]
  CainExt:
    type: app-extension
    platform: iOS
    sources: [CainExt, Shared]
    dependencies:
      - framework: Vendor/Libbox.xcframework
        embed: false          # static library (gomobile), linked in
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_NAME: CainExt
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(CAIN_BUNDLE_ID).ext
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 该隐
    info:
      path: CainExt/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 该隐
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        CainAppGroup: group.$(CAIN_BUNDLE_ID)
    postBuildScripts:
      - name: Build number = git commit count
        basedOnDependencyAnalysis: false
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo "$CURRENT_PROJECT_VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: CainExt/CainExt.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.$(CAIN_BUNDLE_ID)]
schemes:
  Cain:
    build:
      targets:
        Cain: all
